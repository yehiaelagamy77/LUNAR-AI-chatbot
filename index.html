<!DOCTYPE html>
<html>
  <head>
    <title>LUNAR.AI</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .body {
        background: radial-gradient(circle at 50% -10%, #22384f 0%, #0f1c2b 55%, #17293d 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 16px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      .app-container {
        max-width: 460px;
        width: 100%;
        margin: 0 auto;
        background-color: #2b2430;
        border-radius: 26px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(212, 69, 10, 0.08);
        display: flex;
        flex-direction: column;
        height: 620px;
        overflow: hidden;
      }

      /* ---------- Header ---------- */
      .lunar-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        background: linear-gradient(135deg, #3a2f38 0%, #2b2430 100%);
        border-bottom: 1px solid rgba(212, 69, 10, 0.15);
      }

      .lunar-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffb27a, #D4450A 65%, #9c2e02 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(212, 69, 10, 0.15);
      }

      .lunar-title {
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }

      .lunar-title span:first-child {
        font-weight: 700;
        font-size: 16px;
        color: #fff8f2;
        letter-spacing: 0.5px;
      }

      .lunar-status {
        font-size: 12px;
        color: #c9a99f;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #6fcf97;
        box-shadow: 0 0 6px #6fcf97;
      }

      /* ---------- Message area ---------- */
      .messages-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .messages-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .messages-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(212, 69, 10, 0.35);
        border-radius: 10px;
      }

      .empty-state {
        margin: auto;
        text-align: center;
        color: #9c8a92;
        padding: 20px;
      }

      .empty-state .lunar-logo {
        margin: 0 auto 14px;
      }

      .empty-state h3 {
        color: #f0e4e0;
        margin: 0 0 6px;
        font-size: 16px;
      }

      .empty-state p {
        margin: 0;
        font-size: 13px;
      }

      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 85%;
        animation: rise 0.25s ease;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .msg-row.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg-row.robot {
        align-self: flex-start;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff8f2;
      }

      .avatar.robot {
        background: radial-gradient(circle at 35% 35%, #ffb27a, #D4450A 70%);
      }

      .avatar.user {
        background-color: #6e5b66;
        color: #f0e4e0;
      }

      .bubble {
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .msg-row.robot .bubble {
        background-color: #40353c;
        color: #f5ece9;
        border-bottom-left-radius: 4px;
      }

      .msg-row.user .bubble {
        background-color: #D4450A;
        color: #fff8f2;
        border-bottom-right-radius: 4px;
      }

      /* ---------- Typing indicator ---------- */
      .typing-dots {
        display: flex;
        gap: 4px;
        padding: 12px 14px;
      }

      .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #d9b8ac;
        animation: bounce 1.2s infinite ease-in-out;
      }

      .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      /* ---------- Input ---------- */
      .chat-input-container {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        background-color: #241e28;
        border-top: 1px solid rgba(212, 69, 10, 0.15);
      }

      .chat-input {
        padding: 12px 16px;
        border-radius: 22px;
        font-size: 14px;
        background-color: #3a2f38;
        color: #fff8f2;
        border: 1px solid transparent;
        flex-grow: 1;
        outline: none;
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }

      .chat-input::placeholder {
        color: #a58c92;
      }

      .chat-input:focus {
        border-color: #D4450A;
        background-color: #40353c;
      }

      .chat-input:disabled {
        opacity: 0.6;
      }

      .send-button {
        background-color: #D4450A;
        color: #fff8f2;
        padding: 0;
        width: 44px;
        height: 44px;
        margin: 0;
        border: none;
        border-radius: 50%;
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease, transform 0.15s ease;
      }

      .send-button:hover:not(:disabled) {
        background-color: #B83602;
        transform: scale(1.05);
      }

      .send-button:active:not(:disabled) {
        transform: scale(0.95);
      }

      .send-button:disabled {
        background-color: #6e5b66;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="body">
    <div class="js-container"></div>
   <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> 
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      function TypingIndicator() {
        return (
          <div className="msg-row robot">
            <div className="avatar robot">L</div>
            <div className="bubble typing-dots">
              <span></span><span></span><span></span>
            </div>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div className={`msg-row ${sender}`}>
            <div className={`avatar ${sender}`}>{sender === 'robot' ? 'L' : 'Y'}</div>
            <div className="bubble">{message}</div>
          </div>
        );
      }

      function ChatMesseges({ chatMessages, isLoading }) {
        const bottomRef = useRef(null);

        useEffect(() => {
          bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [chatMessages, isLoading]);

        if (chatMessages.length === 0 && !isLoading) {
          return (
            <div className="messages-scroll">
              <div className="empty-state">
                <div className="lunar-logo">🌙</div>
                <h3>Ask Lunar anything</h3>
                <p>Your questions, answered under the stars.</p>
              </div>
            </div>
          );
        }

        return (
          <div className="messages-scroll">
            {chatMessages.map((m) => (
              <ChatMessage key={m.id} message={m.message} sender={m.sender} />
            ))}
            {isLoading && <TypingIndicator />}
            <div ref={bottomRef} />
          </div>
        );
      }

      function ChatInput({ chatMessages, setChatMessages, isLoading, setIsLoading }) {
        const [inputValue, setInputValue] = useState('');

        const sendMessage = async () => {
          if (!inputValue.trim() || isLoading) return;

          const newMessage = {
            id: `id${chatMessages.length + 1}`,
            message: inputValue,
            sender: 'user'
          };

          const updatedMessages = [...chatMessages, newMessage];
          setChatMessages(updatedMessages);
          setInputValue('');
          setIsLoading(true);

          try {
            const apiMessages = updatedMessages.map((m) => ({
              role: m.sender === 'user' ? 'user' : 'assistant',
              content: m.message
            }));

            const response = await fetch("https://api.anthropic.com/v1/messages", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "claude-sonnet-4-6",
                max_tokens: 1000,
                messages: apiMessages,
              })
            });

            const data = await response.json();

            const replyText = (data.content || [])
              .map((block) => (block.type === "text" ? block.text : ""))
              .filter(Boolean)
              .join("\n") || "Sorry, I couldn't come up with a response.";

            const robotMessage = {
              id: `id${updatedMessages.length + 1}`,
              message: replyText,
              sender: 'robot'
            };

            setChatMessages([...updatedMessages, robotMessage]);
          } catch (error) {
            const errorMessage = {
              id: `id${updatedMessages.length + 1}`,
              message: "Something went wrong reaching Lunar. Please try again.",
              sender: 'robot'
            };
            setChatMessages([...updatedMessages, errorMessage]);
          } finally {
            setIsLoading(false);
          }
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Enter') {
            sendMessage();
          }
        };

        return (
          <div className="chat-input-container">
            <input
              type="text"
              placeholder="ask lunar"
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              onKeyDown={handleKeyDown}
              className="chat-input"
              disabled={isLoading}
            />
            <button
              onClick={sendMessage}
              className="send-button"
              disabled={isLoading}
              aria-label="Send message"
            >{isLoading ? '···' : '➤'}</button>
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = useState([]);
        const [isLoading, setIsLoading] = useState(false);

        return (
          <div className="app-container">
            <div className="lunar-header">
              <div className="lunar-logo">🌙</div>
              <div className="lunar-title">
                <span>LUNAR.AI</span>
                <span className="lunar-status"><span className="status-dot"></span>Online</span>
              </div>
            </div>
            <ChatMesseges chatMessages={chatMessages} isLoading={isLoading} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
